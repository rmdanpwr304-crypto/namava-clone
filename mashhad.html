<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>عکس‌های شهر مشهد | گالری شهرهای ایران</title>

  <meta name="description"
    content="گالری تصاویر دیدنی از شهر مشهد؛ جاذبه‌ها، خیابان‌ها، معماری و مکان‌های زیبای مشهد.">

  <meta name="robots" content="index, follow">


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background: #f5f6fa;
      color: #222;
    }


    /* هدر */

    header {

      background: #111827;
      color: white;

      padding: 18px 7%;

      display: flex;

      align-items: center;

      justify-content: space-between;

    }


    .logo {

      font-size: 23px;

      font-weight: bold;

    }


    .logo span {

      color: #8b5cf6;

    }


    .back {

      color: white;

      text-decoration: none;

      background: #7c3aed;

      padding: 10px 18px;

      border-radius: 8px;

    }


    /* معرفی شهر */

    .hero {

      min-height: 330px;

      background:

        linear-gradient(
          rgba(10,15,30,0.70),
          rgba(10,15,30,0.88)
        ),

        url("https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1600&q=80");


      background-size: cover;

      background-position: center;


      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      color: white;

      padding: 40px 20px;

    }


    .hero h1 {

      font-size: 42px;

      margin-bottom: 15px;

    }


    .hero p {

      max-width: 700px;

      line-height: 2;

      color: #ddd;

      font-size: 17px;

    }


    /* گالری */

    .container {

      width: 90%;

      max-width: 1200px;

      margin: 55px auto;

    }


    .section-title {

      font-size: 28px;

      margin-bottom: 30px;

      border-right: 5px solid #7c3aed;

      padding-right: 15px;

    }


    .gallery {

      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));

      gap: 20px;

    }


    .gallery img {

      width: 100%;

      height: 260px;

      object-fit: cover;

      border-radius: 15px;

      box-shadow:
        0 8px 20px rgba(0,0,0,0.12);

      transition: 0.4s;

    }


    .gallery img:hover {

      transform: scale(1.04);

    }


    /* فوتر */

    footer {

      background: #111827;

      color: #aaa;

      text-align: center;

      padding: 30px;

    }


    @media (max-width: 700px) {

      .hero h1 {

        font-size: 30px;

      }


      .gallery {

        grid-template-columns:
          repeat(2, 1fr);

        gap: 12px;

      }


      .gallery img {

        height: 180px;

      }

    }

  </style>

</head>


<body>


  <!-- هدر -->

  <header>

    <div class="logo">

      🇮🇷 گالری <span>شهرها</span>

    </div>


    <a href="index.html" class="back">

      بازگشت به خانه

    </a>

  </header>



  <!-- معرفی -->

  <section class="hero">

    <h1>

      🕌 گالری تصاویر مشهد

    </h1>


    <p>

      مجموعه‌ای از تصاویر دیدنی شهر مشهد،
      جاذبه‌های گردشگری، معماری و زیبایی‌های این شهر تاریخی.

    </p>

  </section>



  <!-- گالری -->

  <main class="container">


    <h2 class="section-title">

      عکس‌های مشهد

    </h2>


    <div class="gallery">


      <img
        src="https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=800&q=80"
        alt="نمایی از شهر مشهد"
      >


      <img
        src="https://images.unsplash.com/photo-1524492412937-b28074a5d7da?auto=format&fit=crop&w=800&q=80"
        alt="معماری تاریخی ایران"
      >


      <img
        src="https://images.unsplash.com/photo-1564501049412-61c2a3083791?auto=format&fit=crop&w=800&q=80"
        alt="جاذبه گردشگری مشهد"
      >


      <img
        src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80"
        alt="طبیعت اطراف مشهد"
      >


      <img
        src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80"
        alt="منظره‌ای دیدنی"
      >


      <img
        src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=800&q=80"
        alt="نمایی زیبا از ایران"
      >

    </div>


  </main>



  <!-- فوتر -->

  <footer>

    © 2026 گالری شهرهای ایران

  </footer>


</body>

  </html>
