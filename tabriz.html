<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>گالری تصاویر تبریز | گالری شهرهای ایران</title>

  <meta name="description"
    content="گالری تصاویر تبریز؛ مجموعه‌ای از تصاویر دیدنی، تاریخی، طبیعی و معماری شهر تبریز در گالری شهرهای ایران.">

  <meta name="robots" content="index, follow">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
      line-height: 1.8;
    }


    /* هدر */

    header {
      background: linear-gradient(135deg, #263238, #546e7a);
      color: white;
      text-align: center;
      padding: 55px 20px 45px;
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
    }

    header p {
      margin: 12px 0 0;
      color: #e4eaed;
      font-size: 1.05rem;
    }


    /* دکمه بازگشت */

    nav {
      margin-top: 22px;
    }

    nav a {
      display: inline-block;
      background: white;
      color: #37474f;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: bold;
      transition: 0.3s;
    }

    nav a:hover {
      transform: scale(1.05);
    }


    /* محتوا */

    main {
      max-width: 1150px;
      margin: auto;
      padding: 40px 18px;
    }


    /* معرفی */

    .intro {
      text-align: center;
      max-width: 780px;
      margin: 0 auto 40px;
    }

    .intro h2 {
      margin-bottom: 10px;
      color: #37474f;
      font-size: 2rem;
    }

    .intro p {
      color: #555;
    }


    /* گالری */

    .gallery {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));

      gap: 20px;
    }


    /* کارت */

    .photo {
      background: white;
      border-radius: 18px;
      overflow: hidden;

      box-shadow:
        0 5px 18px rgba(0,0,0,.10);

      transition: 0.35s;
    }

    .photo:hover {
      transform: translateY(-7px);

      box-shadow:
        0 12px 30px rgba(0,0,0,.18);
    }


    /* تصویر */

    .photo img {
      width: 100%;
      height: 230px;

      object-fit: cover;

      display: block;

      background: #ddd;
    }


    /* عنوان */

    .caption {
      padding: 15px;
      text-align: center;

      font-size: 1.05rem;
      font-weight: bold;
    }


    /* فوتر */

    footer {
      background: #263238;
      color: #cfd8dc;

      text-align: center;

      padding: 30px 20px;

      margin-top: 30px;
    }


    /* موبایل */

    @media (max-width: 600px) {

      header {
        padding: 45px 15px 35px;
      }

      header h1 {
        font-size: 1.7rem;
      }

      main {
        padding: 30px 14px;
