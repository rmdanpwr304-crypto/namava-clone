<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>گالری تصاویر تهران | گالری شهرها</title>

  <meta name="description" content="گالری تصاویر شهر تهران؛ مجموعه‌ای از تصاویر دیدنی پایتخت ایران در گالری شهرها.">

  <meta name="robots" content="index, follow">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
      line-height: 1.8;
    }

    header {
      background: linear-gradient(135deg,#17324d,#286b8e);
      color: #fff;
      text-align: center;
      padding: 55px 20px 45px;
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
    }

    header p {
      margin: 10px 0 0;
      color: #e5f2f8;
    }

    nav {
      margin-top: 20px;
    }

    nav a {
      display: inline-block;
      background: #fff;
      color: #1d5575;
      text-decoration: none;
      padding: 9px 22px;
      border-radius: 25px;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 35px 18px;
    }

    .intro {
      text-align: center;
      max-width: 760px;
      margin: 0 auto 35px;
    }

    .intro h2 {
      margin-bottom: 8px;
      color: #17324d;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
      gap: 18px;
    }

    .photo {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .photo img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    .placeholder {
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#d8e5ec,#a9c5d3);
      color: #49616d;
      font-size: 1.05rem;
    }

    .caption {
      padding: 12px 15px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 28px;
      color: #666;
    }

    /* بزرگ‌نمایی عکس */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: rgba(0,0,0,.92);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 95%;
      max-height: 85vh;
      border-radius: 10px;
    }

    .close {
      position: absolute;
      top: 15px;
      right: 25px;
      color: white;
      font-size: 50px;
      cursor: pointer;
      line-height: 1;
    }

    @media(max-width:600px) {

      header h1 {
        font-size: 1.7rem;
      }

      main {
        padding: 25px 14px;
      }

    }

  </style>
</head>

<body>

<header>
  <h1>گالری تصاویر تهران</h1>
  <p>دیدنی‌های پایتخت ایران در قاب تصویر</p>

  <nav>
    <a href="index.html">بازگشت به گالری شهرها</a>
  </nav>
</header>


<main>

  <section class="intro">

    <h2>تهران</h2>

    <p>
      تهران، پایتخت ایران، شهری پرجنب‌وجوش با ترکیبی از تاریخ، معماری،
      طبیعت و زندگی مدرن است.
    </p>

  </section>


  <section class="gallery">

    <article class="photo">
      <img src="https://images.unsplash.com/photo-1518684079-3c830dcef090?auto=format&fit=crop&w=900&q=80" alt="نمایی از تهران">
      <div class="caption">نمایی دیدنی از تهران</div>
    </article>

    <article class="photo">
      <img src="https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=900&q=80" alt="معماری ایران">
      <div class="caption">معماری ایران</div>
    </article>

    <article class="photo">
      <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=900&q=80" alt="طبیعت">
      <div class="caption">طبیعت</div>
    </article>

    <article class="photo">
      <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="کوهستان">
      <div class="caption">مناظر طبیعی</div>
    </article>

    <article class="photo">
      <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="منظره">
      <div class="caption">جاذبه‌های دیدنی</div>
    </article>

    <article class="photo">
      <img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=900&q=80" alt="چشم‌انداز">
      <div class="caption">چشم‌انداز زیبا</div>
    </article>

  </section>

</main>


<footer>
  © گالری شهرها - تصاویر تهران
</footer>


<!-- پنجره بزرگ‌نمایی -->
<div class="lightbox" id="lightbox">
  <span class="close">&times;</span>
  <img id="lightbox-img" src="" alt="تصویر بزرگ">
</div>


<script>

  const images = document.querySelectorAll('.gallery img');

  const lightbox = document.getElementById('lightbox');

  const lightboxImg = document.getElementById('lightbox-img');

  const close = document.querySelector('.close');


  images.forEach(img => {

    img.addEventListener('click', () => {

      lightbox.classList.add('active');

      lightboxImg.src = img.src;

      lightboxImg.alt = img.alt;

    });

  });


  close.addEventListener('click', () => {

    lightbox.classList.remove('active');

  });


  lightbox.addEventListener('click', (e) => {

    if (e.target === lightbox) {

      lightbox.classList.remove('active');

    }

  });

</script>


</body>
</html>
