
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فیلم‌خانه</title>
  <style>
    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
      font-family: Tahoma, Arial, sans-serif;
      .search-box {
  display: flex;
  gap: 10px;
  max-width: 700px;
  margin: 25px auto;
  padding: 0 20px;
}

.search-box input {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #1c1c24;
  color: white;
  font-size: 15px;
}

.search-box button {
  padding: 14px 22px;
  border: none;
  border-radius: 8px;
  background: #00c896;
  color: #000;
  font-weight: bold;
} 
    }

    header {
      background: #15151b;
      padding: 20px;
      text-align: center;
    }

    .logo {
      color: #00c896;
      font-size: 28px;
      font-weight: bold;
    }

    .hero {
      padding: 70px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 38px;
    }

    .hero p {
      color: #aaa;
      line-height: 2;
    }

    .button {
      display: inline-block;
      background: #00c896;
      color: #000;
      padding: 12px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 20px;
    }

    .movie {
      background: #18181f;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }

    .poster {
      height: 180px;
      background: #292933;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      border-radius: 8px;
      overflow: hidden;
      .poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
} 
    }

    .movie h3 {
      margin-bottom: 5px;
    }

    .movie p {
      color: #999;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">فیلم‌خانه 🎬</div>
  </header>
<div class="search-box">
  <input type="text" placeholder="نام فیلم یا سریال را جستجو کنید...">
  <button>جستجو 🔍</button>
</div>
  <section class="hero">
    <h1>دنیای فیلم و سریال</h1>
    <p>به سایت فیلم و سریال ما خوش آمدید.</p>
    <a href="#movies" class="button">مشاهده فیلم‌ها</a>
  </section>

  <section class="movies" id="movies">

    <div class="movie">
      <div class="poster">
  <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=500&q=80" alt="پوستر فیلم">
      </div>
      <h3>فیلم شماره ۱</h3>
      <p>⭐ 8.5 | اکشن</p>
    </div>

    <div class="movie">
      <div class="poster">
  <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=500&q=80" alt="پوستر فیلم">
      </div>
      <h3>فیلم شماره ۲</h3>
      <p>⭐ 8.1 | درام</p>
    </div>

    <div class="movie">
      <div class="poster">
  <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=500&q=80" alt="پوستر فیلم">
      </div>
      <h3>فیلم شماره ۳</h3>
      <p>⭐ 7.9 | کمدی</p>
    </div>

    <div class="movie">
      <div class="poster">
  <img src="https://images.unsplash.com/photo-1518930259200-6aee7a5b3d6e?auto=format&fit=crop&w=500&q=80" alt="پوستر فیلم">
      </div>
      <h3>فیلم شماره ۴</h3>
      <p>⭐ 8.7 | ماجراجویی</p>
    </div>

  </section>

</body>
</html>
