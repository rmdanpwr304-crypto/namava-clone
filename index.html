
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فیلم‌خانه</title>
  <style>
    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
      font-family: Tahoma, Arial, sans-serif;
    }

    header {
      background: #15151b;
      padding: 20px;
      text-align: center;
    }

    .logo {
      color: #00c896;
      font-size: 28px;
      font-weight: bold;
    }

    .hero {
      padding: 70px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 38px;
    }

    .hero p {
      color: #aaa;
      line-height: 2;
    }

    .button {
      display: inline-block;
      background: #00c896;
      color: #000;
      padding: 12px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 20px;
    }

    .movie {
      background: #18181f;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }

    .poster {
      height: 180px;
      background: #292933;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      border-radius: 8px;
    }

    .movie h3 {
      margin-bottom: 5px;
    }

    .movie p {
      color: #999;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">فیلم‌خانه 🎬</div>
  </header>

  <section class="hero">
    <h1>دنیای فیلم و سریال</h1>
    <p>به سایت فیلم و سریال ما خوش آمدید.</p>
    <a href="#movies" class="button">مشاهده فیلم‌ها</a>
  </section>

  <section class="movies" id="movies">

    <div class="movie">
      <div class="poster">🎬</div>
      <h3>فیلم شماره ۱</h3>
      <p>⭐ 8.5 | اکشن</p>
    </div>

    <div class="movie">
      <div class="poster">🎥</div>
      <h3>فیلم شماره ۲</h3>
      <p>⭐ 8.1 | درام</p>
    </div>

    <div class="movie">
      <div class="poster">🍿</div>
      <h3>فیلم شماره ۳</h3>
      <p>⭐ 7.9 | کمدی</p>
    </div>

    <div class="movie">
      <div class="poster">🎞️</div>
      <h3>فیلم شماره ۴</h3>
      <p>⭐ 8.7 | ماجراجویی</p>
    </div>

  </section>

</body>
</html>
