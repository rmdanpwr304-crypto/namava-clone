<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>عکس دخترهای اهواز | گالری شهرها</title>

  <meta
    name="description"
    content="گالری تصاویر اهواز در سایت گالری شهرها."
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      background: #222;
      padding: 25px 15px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 22px;
      background: #444;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .back:hover {
      background: #666;
    }

    .gallery {
      padding: 25px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      max-width: 1200px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
    }

  </style>

</head>


<body>

  <header>

    <h1>عکس‌های اهواز</h1>

    <a
      class="back"
      href="index.html"
    >
      بازگشت به صفحه اصلی
    </a>

  </header>


  <div class="gallery">

    <img
      src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1200&q=80"
      alt="تصویر اهواز"
    >

  </div>


</body>

</html>
