
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>عکس‌های اهواز | گالری شهرها</title>

  <meta name="description" content="گالری تصاویر زیبای شهر اهواز">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      overflow-x: hidden;
    }

    header {
      background: #222;
      padding: 25px 15px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 20px;
      background: #444;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .gallery {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 15px;

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .gallery img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      border-radius: 10px;
    }

    @media (min-width: 700px) {
      .gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .gallery img {
        height: 220px;
      }
    }

  </style>

</head>


<body>

  <header>

    <h1>عکس‌های اهواز</h1>

    <a class="back" href="index.html">
      بازگشت به صفحه اصلی
    </a>

  </header>


  <div class="gallery">

    <img
      src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Ahwaz_white_bridge.jpg"
      alt="پل سفید اهواز"
    >

    <img
      src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Ahvaz_city.jpg/1280px-Ahvaz_city.jpg"
      alt="نمای شهر اهواز"
    >

    <img
      src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1000&q=80"
      alt="منظره اهواز"
    >

    <img
      src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=1000&q=80"
      alt="نمای شهری"
    >

  </div>


</body>

</html>
